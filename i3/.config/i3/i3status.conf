general {
    colors = false
    interval = 5
    output_format = "i3bar"
    markup = "pango"
}

order += "wireless _first_"
order += "ethernet _first_"
order += "battery all"
order += "disk /"
order += "memory"
order += "cpu_usage"
order += "volume master"
order += "tztime date_num"
order += "tztime date_name"
order += "tztime clock"

# Each whole module is wrapped in one pango colour so label and value never mix colours.
# Catppuccin Mocha palette, one accent per module.
wireless _first_ {
    format_up = "<span foreground='#89dceb'>W: %essid %quality %ip</span>"
    format_down = "<span foreground='#f38ba8'>W: down</span>"
}

ethernet _first_ {
    format_up = "<span foreground='#74c7ec'>E: %ip</span>"
    format_down = ""
}

battery all {
    format = "<span foreground='#a6e3a1'>BAT: %status %percentage %remaining</span>"
    format_down = ""
    low_threshold = 20
    threshold_type = "percentage"
}

disk "/" {
    format = "<span foreground='#cba6f7'>DISK: %avail</span>"
}

memory {
    format = "<span foreground='#f9e2af'>MEM: %percentage_used (%used / %total)</span>"
    threshold_degraded = "1G"
    threshold_critical = "200M"
}

cpu_usage {
    format = "<span foreground='#94e2d5'>CPU: %usage</span>"
}

volume master {
    format = "<span foreground='#f5c2e7'>VOL: %volume</span>"
    format_muted = "<span foreground='#6c7086'>VOL: muted</span>"
    device = "default"
    mixer = "Master"
    mixer_idx = 0
}

# Date twice (numeric peach, named blue) then the clock in lavender; one colour each.
tztime date_num {
    format = "<span foreground='#fab387'>%m-%d-%Y</span>"
}
tztime date_name {
    format = "<span foreground='#89b4fa'>%a %d %b %Y</span>"
}
tztime clock {
    format = "<span foreground='#b4befe'>%I:%M:%S %p</span>"
}
