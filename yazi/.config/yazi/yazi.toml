[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_dir_first = true
sort_translit  = true
linemode       = "size_and_mtime"
show_hidden    = false
show_symlink   = true
scrolloff      = 5
title_format   = "Yazi: {cwd}"

[preview]
wrap          = "no"
tab_size      = 2
max_width     = 1200
max_height    = 1800
image_quality = 85

[plugin]
prepend_fetchers = [
	{ url = "*",  run = "git", group = "git" },
	{ url = "*/", run = "git", group = "git" },
	{ url = "*/", run = "dir-size", group = "dir-size" },
]
prepend_previewers = [
	{ mime = "image/{png,jpeg,gif,webp,bmp,tiff}", run = "chafa-preview image" },
	{ mime = "video/*", run = "chafa-preview video" },
	{ mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", run = "ouch --show-file-icons" },
]

[tasks]
# Some wallpapers here are 11520x6480; the default memory cap refuses to decode them
image_alloc = 1073741824
