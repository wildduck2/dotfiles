# Azkar on every platform it ships to: the Swift apps on macOS and iOS, and the Kotlin apps for
# Linux, Windows, Android and iOS. jpackage only builds for the machine it runs on, so each
# installer has its own job.
name: azkar

on:
  # Branches only. A release tag goes through azkar-release.yml, which calls this workflow itself,
  # and two builds of the same commit would only race each other for the runners.
  push:
    branches: ["**"]
    paths: ["azkar/**", ".github/workflows/azkar*.yml"]
  pull_request:
    paths: ["azkar/**", ".github/workflows/azkar*.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "What to name the packages, e.g. 1.2.0"
        type: string
        required: true

concurrency:
  group: azkar-${{ github.ref }}
  cancel-in-progress: true

# Every job runs the same package.sh a laptop runs, so this is the only place a release's version
# differs from the one in the script.
env:
  AZKAR_VERSION: ${{ inputs.version || '1.0.0' }}

jobs:
  linux:
    name: Linux — tests, .deb and the Android .apk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: azkar/kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # jpackage builds the .deb with dpkg-deb, as root-owned files, through fakeroot.
      - name: Install the packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils
        working-directory: .
      # The phone app is built here too: it is the same shared code, and the SDK is a download away.
      - name: Install the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.0 build-tools;37.0.0
      # The shared UI tests draw for real, so they need a display to draw on.
      - name: Tests
        run: xvfb-run -a ./gradlew :shared:jvmTest :desktopApp:test :androidApp:testDebugUnitTest
      # The same command as on a laptop, so the files are named the same wherever they were built.
      - name: Package
        run: ./package.sh
        working-directory: azkar
      # package.sh reports what it couldn't build and carries on, which is what you want on a
      # laptop and not what you want here: on this runner every one of these is buildable, so a
      # missing file is a broken build, not a machine without the tools.
      - name: Check every package was made
        shell: bash
        run: |
          for pattern in 'azkar-*-linux-*.deb' 'azkar-*-linux-*.AppImage' 'azkar-*-android.apk'; do
            ls dist/$pattern > /dev/null || { echo "missing: $pattern"; exit 1; }
          done
        working-directory: azkar
      - uses: actions/upload-artifact@v4
        with:
          name: azkar-linux
          path: azkar/dist/*

  windows:
    name: Windows — tests and .msi
    runs-on: windows-latest
    defaults:
      run:
        working-directory: azkar/kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # jpackage makes the .msi with the WiX toolset that ships with the runner image.
      - name: Put WiX on the PATH
        shell: pwsh
        run: if ($env:WIX) { Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:WIX 'bin') }
        working-directory: .
      - name: Tests
        run: ./gradlew :shared:jvmTest :desktopApp:test
      - name: Package
        shell: bash
        run: ./package.sh
        working-directory: azkar
      # package.sh reports what it couldn't build and carries on, which is what you want on a
      # laptop and not what you want here: on this runner every one of these is buildable, so a
      # missing file is a broken build, not a machine without the tools.
      - name: Check every package was made
        shell: bash
        run: |
          for pattern in 'azkar-*-windows-*.msi'; do
            ls dist/$pattern > /dev/null || { echo "missing: $pattern"; exit 1; }
          done
        working-directory: azkar
      - uses: actions/upload-artifact@v4
        with:
          name: azkar-windows
          path: azkar/dist/*

  apple:
    name: macOS — Swift tests and both iPhone apps
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        run: ./build.sh test
        working-directory: azkar/apple
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # The iOS simulator tests are the ones that can't run on a Mac without Xcode, so they run here.
      - name: Kotlin tests, including the iOS simulator
        run: ./gradlew :shared:jvmTest :shared:iosSimulatorArm64Test :shared:compileKotlinIosArm64
        working-directory: azkar/kotlin
      # Neither .xcodeproj is checked in: each is generated from the project.yml beside it.
      - name: Install XcodeGen
        run: brew install xcodegen
      # Draws the icon, checks the Swift sources, generates both .xcodeproj, then builds each iPhone
      # app for a phone and for the simulator — which is every check the old explicit steps ran, in
      # Release rather than Debug. The Compose one's build phase runs Gradle for Shared.framework,
      # so it needs the JDK this job already has.
      - name: Package
        run: ./package.sh
        working-directory: azkar
      # package.sh reports what it couldn't build and carries on, which is what you want on a
      # laptop and not what you want here: on this runner every one of these is buildable, so a
      # missing file is a broken build, not a machine without the tools.
      - name: Check every package was made
        shell: bash
        run: |
          for pattern in 'azkar-*-macos-*.dmg' 'azkar-*-macos-desktop-*.dmg' 'azkar-*-ios.ipa' 'azkar-*-ios-compose.ipa'; do
            ls dist/$pattern > /dev/null || { echo "missing: $pattern"; exit 1; }
          done
        working-directory: azkar
      - uses: actions/upload-artifact@v4
        with:
          name: azkar-macos
          path: azkar/dist/*
