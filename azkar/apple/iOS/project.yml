# The Xcode project, generated by XcodeGen (`apple/build.sh ios`), because a .xcodeproj is
# machine-written noise no one should have to read in a diff.
name: Azkar
options:
  bundleIdPrefix: com.wildduck
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  Azkar:
    type: application
    platform: iOS
    sources:
      # The same core the Mac app is built from.
      - path: ../Core
      - path: App
      # The icon, drawn by macOS/tools/icon.swift into .build (see build.sh).
      - path: ../.build/iOS/Assets.xcassets
        optional: true
      # The azkar themselves ship inside the app: a phone has no ~/.config to read.
      - path: ../../.config/azkar/azkar.json
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Azkar
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Planning the next reminders is all the app asks to do in the background.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.wildduck.azkar.refresh]
    # A shared scheme, so `xcodebuild -scheme Azkar` works without opening Xcode first.
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wildduck.azkar
        PRODUCT_NAME: Azkar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
