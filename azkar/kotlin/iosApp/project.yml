# The Xcode project, generated by XcodeGen, for the Compose app: a shell around kotlin/shared.
# Everything inside the window comes from the same code the desktop and Android apps draw.
name: AzkarKMP
options:
  bundleIdPrefix: com.wildduck
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  AzkarKMP:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      # The same icon the other two apps use, drawn by `apple/build.sh ios`.
      - path: ../../apple/.build/iOS/Assets.xcassets
        optional: true
      # The azkar themselves ship inside the app: a phone has no ~/.config to read.
      - path: ../../.config/azkar/azkar.json
        buildPhase: resources
    preBuildScripts:
      # Builds shared/ for this device or simulator and puts Shared.framework where the linker looks.
      # Needs a JDK on PATH (or JAVA_HOME set), like every other Gradle build here.
      - name: Compile the Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    info:
      path: Info.plist
      properties:
        # Both iPhone apps can be installed at once, so they say which is which.
        CFBundleDisplayName: Azkar KMP
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Planning the next reminders is all the app asks to do in the background.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.wildduck.azkar.kmp.refresh]
    # A shared scheme, so `xcodebuild -scheme Azkar` works without opening Xcode first.
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wildduck.azkar.kmp
        PRODUCT_NAME: Azkar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework Shared
