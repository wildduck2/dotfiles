# Calls use mSBC (16 kHz) instead of CVSD (8 kHz); music stays on A2DP and
# WirePlumber switches to the headset profile only while an app uses the mic
monitor.bluez.properties = {
  bluez5.enable-msbc = true
  bluez5.hfphsp-backend = "native"
}

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = true
}
