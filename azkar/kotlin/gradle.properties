kotlin.code.style=official
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin Multiplatform with com.android.library: AGP 9's built-in Kotlin and new DSL don't allow it, and the
# Compose resources plugin (1.12.0) doesn't know the com.android.kotlin.multiplatform.library target yet, so the
# Arabic font would never reach the APK. Both flags go away once Compose supports that plugin.
android.builtInKotlin=false
android.newDsl=false
